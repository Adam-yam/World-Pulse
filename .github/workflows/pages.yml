name: Hourly news and Pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: east-pulse-pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect news and trends
        run: python scripts/collect.py
      - name: Save latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/snapshot.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update hourly news snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
